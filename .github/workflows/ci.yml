# AuthRes CI: run the full test suite on every push and pull request.
#
# Python matrix follows the documented support statement: the complete test
# toolchain requires Python 3.11+ (hypothesis floor); 3.15 is the newest
# verified locally. The suite is fully offline and headless.

name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    name: tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Show installed versions
        run: python -m pip list

      - name: Run full test suite
        run: python -m pytest -q
        env:
          PYTHONDONTWRITEBYTECODE: "1"
